:root{--sage:#ffc46b;--ink:#0e0c0a;--cream:#f6f1e9;--c1:#15606b;--c2:#0e4450;--c3:#082a33;--v1:#0e3442;--v2:#1f6f74;--t1:#e9c23c;--t2:#9a7a22;--b1:#0e3442;--b2:#0b2430;--b3:#05141a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 55% at 50% 42%,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%)}
.spot{position:absolute;left:50%;top:-20%;width:90vmin;height:140vh;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0,transparent 160deg,rgba(255,240,205,.10) 175deg,rgba(255,240,205,.16) 180deg,rgba(255,240,205,.10) 185deg,transparent 200deg);filter:blur(8px);opacity:0;transition:opacity 2.5s}

.cur{position:fixed;top:0;bottom:0;width:51vw;z-index:20;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 3.2vw,rgba(255,255,255,.06) 4.6vw,rgba(0,0,0,0) 6vw,rgba(0,0,0,.42) 7.4vw),
  linear-gradient(180deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);box-shadow:inset 0 -40px 80px rgba(0,0,0,.55);transition:transform 2.6s cubic-bezier(.7,0,.2,1)}
.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,var(--t1) 0 6px,var(--t2) 6px 12px);opacity:.9}
.cur.l{left:0;transform-origin:left}.cur.r{right:0;transform-origin:right}
.go .cur.l{transform:translateX(-102%) skewX(4deg)}.go .cur.r{transform:translateX(102%) skewX(-4deg)}
.val{position:fixed;left:0;right:0;top:0;height:13vh;z-index:21;background:repeating-linear-gradient(90deg,var(--v1) 0,var(--v2) 2.5vw,var(--v1) 5vw);box-shadow:0 12px 30px rgba(0,0,0,.6);border-bottom:6px solid var(--t1)}
.val::after{content:"";position:absolute;left:0;right:0;bottom:-26px;height:26px;background:radial-gradient(14px 18px at 14px 0,var(--v1) 98%,transparent) 0 0/28px 26px repeat-x}

.btn i{width:0;height:0;border-left:14px solid #1a1814;border-top:9px solid transparent;border-bottom:9px solid transparent}

.go .orb{opacity:1;transform:none}

.orb b:nth-child(2){inset:14px;border-color:rgba(213,216,191,.35)}.orb b:nth-child(3){inset:30px;background:radial-gradient(circle,#f3ead0 0,#cdb980 45%,rgba(205,185,128,0) 72%);border:0}

.win.on{opacity:1;transform:none}

.win .bar i{width:11px;height:11px;border-radius:50%;background:#d6cfc2}.win .bar i:nth-child(1){background:#ed6a5e}.win .bar i:nth-child(2){background:#f4bf4f}.win .bar i:nth-child(3){background:#61c554}
.win .bar u{margin-left:14px;flex:1;max-width:420px;height:22px;border-radius:11px;background:#fff;color:#555;font:500 12px/22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-decoration:none;padding:0 12px;white-space:nowrap;overflow:hidden}
.win .scr{position:relative;aspect-ratio:1568/726;border-radius:0 0 14px 14px;overflow:hidden;background:#111 center/cover no-repeat;box-shadow:0 40px 120px -30px rgba(0,0,0,.9)}
.win .lab{position:absolute;left:0;top:auto;bottom:100%;margin:0 0 12px;line-height:1.15;font:500 clamp(18px,2vw,26px) "Fraunces",Georgia,serif;color:#fff}
.win .lab small{display:block;font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#bdb596;margin-bottom:4px}
.tiles{position:absolute;inset:34px 0 0 0;pointer-events:none}
.tiles s{position:absolute;background-repeat:no-repeat;transition:transform 1.4s cubic-bezier(.2,.6,.2,1),opacity 1.4s;will-change:transform,opacity}
.boom .bar,.boom .scr{opacity:0;transition:opacity .05s}
.win .lab{transition:opacity .5s}.boom .lab,.tv .lab{opacity:0}.win.gone{opacity:0;transition:opacity .4s}
.flash{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.tv .scr{animation:tvoff .9s cubic-bezier(.6,0,.4,1) forwards}.tv .bar{opacity:0;transition:opacity .3s}
@keyframes tvoff{0%{transform:none;filter:none}40%{transform:scale(1,.012);filter:brightness(3)}75%{transform:scale(.02,.012);filter:brightness(4)}100%{transform:scale(0,0);filter:brightness(5);opacity:0}}
.load{position:absolute;left:8%;right:8%;bottom:9%;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.load b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#949262,#f3e8c6);box-shadow:0 0 18px #f3e8c6}
.neu .scr{filter:blur(14px) brightness(.7);transition:filter 2.6s ease}
.neu.ready .scr{filter:none}
.fin{position:fixed;inset:0;z-index:35;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(circle at 50% 45%,#2f2a1f,#0c0b09);opacity:0;pointer-events:none;transition:opacity .8s}
.fin.on{opacity:1}
.fin img{width:min(70vw,720px);filter:drop-shadow(0 10px 40px rgba(0,0,0,.6));opacity:0;transform:scale(.92);transition:opacity 1s .2s,transform 1.6s cubic-bezier(.2,.7,.1,1) .2s}
.fin.on img{opacity:1;transform:none}
.fin p{margin:0;font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#cfc8a8;opacity:0;transition:opacity 1s .9s}.fin.on p{opacity:1}
.glow{position:fixed;inset:-10%;z-index:14;pointer-events:none;display:none;background:radial-gradient(42% 38% at 50% 50%,rgba(243,232,198,.42),rgba(148,146,98,.16) 48%,transparent 72%);opacity:calc(var(--lv,0)*1.6);transform:scale(calc(.85 + var(--lv,0)*.5))}
.comp .glow{display:block}
.fin .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(243,232,198,.09) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle at 50% 50%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 50%,#000 0,transparent 55%);opacity:0;transition:opacity 1.4s .2s;animation:spin 24s linear infinite}
.fin.on .rays{opacity:1}.fin img,.fin p{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.skip{position:fixed;right:18px;bottom:16px;z-index:50;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#d9d2bd;font:500 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;opacity:.55}
.skip:hover{opacity:1}
@media (max-width:700px){.win{width:90vw}.start{padding:0 18px}.start small{letter-spacing:.2em;line-height:1.6}.cap{left:18px;right:18px}}
.fin{background:radial-gradient(circle at 50% 45%,#1d5962,#05161c)}.fin p{color:#ffdca0}.fin .rays{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,220,160,.10) 0 5deg,transparent 5deg 15deg)}.fin img{width:min(52vw,300px);border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 90px rgba(89,189,180,.4)}
</style>

<body>
<div class="stage" id="st">
  <div class="spot"></div>
  <canvas class="dust" id="dust"></canvas>
  <div class="orb" aria-hidden="true"><b></b><b></b><b></b></div>
  <p class="who">Natans kleiner orangener Freund</p>
  <div class="cap" id="cap" aria-live="polite"></div>
</div>
<div class="cmp" id="cmp">
  <div class="win" data-fx="explode"><p class="lab"><small>Bisher</small>Deine Website heute</p><div class="bar"><i></i><i></i><i></i><u>praxis-verena-paul.de</u></div><div class="scr" style="background-image:url(alt_verena.webp)"></div><div class="tiles"></div></div>
  <div class="win neu"><p class="lab"><small>Ab jetzt</small>Deine neue Website</p><div class="bar"><i></i><i></i><i></i><u>praxis-verena-paul.de · neu</u></div><div class="scr" style="background-image:url(neu_verena.webp)"><div class="load"><b></b></div></div></div>
</div>
<div class="glow" aria-hidden="true"></div>
<div class="fin" id="fin"><i class="rays" aria-hidden="true"></i><img src="logo.png" alt="Verena Paul"><p>Zurück zu deiner Natur</p></div>
<div class="flash" id="flash"></div>
<div class="cur l"></div><div class="cur r"></div><div class="val"></div>
<div class="start" id="start">
  <small>Praxis Verena Paul · Physiotherapie · Heilkunde · Transformation</small>
  <h1>Für <em>Verena</em></h1>
  <button class="btn" id="go" type="button"><i></i>Vorhang auf</button>
  <p class="hint">Ton an · Leertaste oder Klick</p>
</div>
<button class="skip" id="skip" type="button">Direkt zur Seite →</button>
<audio id="v" src="begruessung.mp3" preload="auto"></audio>
<audio id="m" src="musik.mp3" preload="auto"></audio>
<script>
(function(){
  var TARGET = '../verena-paul/';
  var LINES = ["Hallo, <em>Verena.</em>", "Hier ist Natans kleiner, orangener Freund.", "Wir haben in den letzten Tagen etwas gebaut, das dir hoffentlich gefallen wird.", "Du hast ja schon ein paar Mal erwähnt, dass du wachsen möchtest –", "und dass deine Website mal eine Überarbeitung verdient hätte.", "Und du hast so viele wunderschöne Beiträge auf <em>Instagram.</em>", "Es wäre schade, wenn sie nur dort leben.", "Schau dir die Seite ganz in Ruhe an: Passt sie zu dir?", "Was gefällt dir – und was nicht?", "Was möchtest du noch haben, und was sollen wir besser machen?", "Das ist der erste Entwurf – aber trotzdem mit ganz viel <em>Liebe</em> gemacht.", "Wir wünschen dir ein wunderschönes Restwochenende.", "Und jetzt: viel Spaß. <em>Aloha!</em>"];
  var st=document.getElementById('st'), cap=document.getElementById('cap'), v=document.getElementById('v'), m=document.getElementById('m');
  var started=false, compStarted=false, cur=-1, AC=null, an=null, buf=null, anM=null, bufM=null, lvS=0, root=document.documentElement;
  // Zeitplan der Untertitel: nach Textlänge über die echte Audiolänge verteilt
  function plan(d){ var w=LINES.map(function(l){return l.replace(/<[^>]+>/g,'').length+22}), sum=w.reduce(function(a,b){return a+b},0), t=0.35, out=[]; w.forEach(function(x){ out.push(t); t+= (d-0.6)*x/sum; }); return out; }
  // Zeitmarken: automatisch aus den Sprechpausen der Stimme gemessen
  var T = [0, 1.32, 4.52, 9.0, 12.68, 16.2, 19.56, 22.6, 26.28, 28.76, 32.44, 36.84, 39.64];
  function show(i){ if(i===cur) return; cur=i; cap.classList.add('out'); setTimeout(function(){ cap.classList.remove('out'); cap.innerHTML=LINES[i].split(/(\s+)/).map(function(p){return /^\s+$/.test(p)?p:'<span>'+p+'</span>'}).join(''); var s=cap.querySelectorAll('span'); s.forEach(function(x,k){ setTimeout(function(){x.classList.add('on')}, 30+k*45); }); }, cur===0?0:260); }
  // Staub im Licht
  var c=document.getElementById('dust'), g=c.getContext('2d'), P=[]; function rs(){c.width=innerWidth;c.height=innerHeight} rs(); addEventListener('resize',rs);
  for(var i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,s:Math.random()*.15+.03,a:Math.random()*.5+.1});
  (function d(){ g.clearRect(0,0,c.width,c.height); P.forEach(function(p){ p.y-=p.s/1000*(1+lvS*7); if(p.y<0)p.y=1; var x=(.5+(p.x-.5)*.5)*c.width; g.globalAlpha=Math.min(1,p.a*(st.classList.contains('go')?1+lvS*2.5:.2)); g.fillStyle='#f3e8c6'; g.beginPath(); g.arc(x+Math.sin(p.y*20)*12,p.y*c.height,p.r,0,7); g.fill(); }); requestAnimationFrame(d); })();
  // Stimme sichtbar machen
  var orb=document.querySelectorAll('.orb b');
  function viz(){ if(anM){ anM.getByteFrequencyData(bufM); var q=0; for(var i=0;i<bufM.length;i++)q+=bufM[i]; lvS=lvS*.82+(q/bufM.length/255)*.18; root.style.setProperty('--lv',lvS.toFixed(3)); } if(an){ an.getByteFrequencyData(buf); var s=0; for(var i=0;i<buf.length;i++)s+=buf[i]; var lv=s/buf.length/255; orb[0].style.setProperty('--s',1+lv*.9); orb[1].style.setProperty('--s',1+lv*.5); orb[2].style.setProperty('--s',1+lv*.35); } if(!v.paused && !compStarted){ var t=v.currentTime, k=0; for(var j=0;j<T.length;j++) if(t>=T[j]) k=j; show(k); } requestAnimationFrame(viz); }
  function fade(a,to,ms){ var from=a.volume, t0=performance.now(); (function f(n){ var k=Math.min(1,(n-t0)/ms); a.volume=Math.max(0,Math.min(1,from+(to-from)*k)); if(k<1) requestAnimationFrame(f); })(t0); }
  function go(){
    if(started) return; started=true; document.body.classList.add('go'); st.classList.add('go'); document.documentElement.classList.add('go');
    document.querySelectorAll('.cur,.val,.start,.spot').forEach(function(e){e.classList.add('x')});
    document.body.className='go';
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); var src=AC.createMediaElementSource(v); an=AC.createAnalyser(); an.fftSize=256; buf=new Uint8Array(an.frequencyBinCount); src.connect(an); an.connect(AC.destination); var sm=AC.createMediaElementSource(m); anM=AC.createAnalyser(); anM.fftSize=256; bufM=new Uint8Array(anM.frequencyBinCount); sm.connect(anM); anM.connect(AC.destination); }catch(e){}
    m.volume=.0; m.play().then(function(){ fade(m,0.75,2500); }).catch(function(){});
    setTimeout(function(){ v.volume=1; v.play().then(function(){}).catch(function(){ fallbackCaptions(); }); show(0); }, 1700);
    viz();
  }
  function fallbackCaptions(){ var t0=performance.now(); (function f(n){ var t=(n-t0)/1000, k=0; for(var j=0;j<T.length;j++) if(t>=T[j]) k=j; if(!compStarted) show(k); if(t>42.3) return comp(); requestAnimationFrame(f); })(t0); }
  v.addEventListener('ended', comp);
  // Duck: Musik unter der Stimme leise, danach episch
  v.addEventListener('play', function(){ fade(m,0.5,800); });
  function comp(){
    if(compStarted) return; compStarted=true; document.body.classList.add('comp'); fade(m,1,1400); cap.classList.add('out'); document.querySelector('.orb').style.opacity=0; document.querySelector('.who').style.opacity=0;
    var W=[].slice.call(document.querySelectorAll('.cmp .win')), n=W.length, last=W[n-1];
    // Finale auf den Höhepunkt der Musik legen (PEAK = Sekunde im Track)
    var mt=(!m.paused&&m.currentTime>0)?m.currentTime:null, Lmin=n===1?3200:7000, Lg=mt===null?(n===1?3600:8500):Math.max(Lmin,Math.min(10500,(51.75-mt)*1000));
    function out(w){ if(w.dataset.fx==='explode') explode(w); else { w.classList.add('tv'); flash(.35); setTimeout(function(){ w.classList.add('gone'); },950); } }
    if(n>=3){ W[0].classList.add('on'); setTimeout(function(){ out(W[0]); }, Math.min(1900,Lg-6400)); setTimeout(function(){ W[1].classList.add('on'); flash(.28); }, Lg-5500); setTimeout(function(){ out(W[1]); }, Lg-3800); }
    else if(n===2){ W[0].classList.add('on'); setTimeout(function(){ out(W[0]); }, Lg-3800); }
    setTimeout(function(){ last.classList.add('on'); var b=last.querySelector('.load b'), t0=performance.now(); (function f(q){ var k=Math.min(1,(q-t0)/2600); if(b) b.style.width=(k*100)+'%'; if(k>.35) last.classList.add('ready'); if(k<1) requestAnimationFrame(f); })(t0); }, Lg-2900);
    setTimeout(function(){ flash(.9); document.getElementById('fin').classList.add('on'); last.style.opacity=0; }, Lg);
    setTimeout(function(){ fade(m,0,1600); }, Lg+1500);
    setTimeout(function(){ location.href=TARGET; }, Lg+2900);
  }
  function flash(o){ var f=document.getElementById('flash'); f.style.opacity=o; setTimeout(function(){ f.style.opacity=0; }, 180); }
  function explode(w){
    var scr=w.querySelector('.scr'), box=scr.getBoundingClientRect(), wb=w.getBoundingClientRect(), tl=w.querySelector('.tiles'), cols=12, rows=6, tw=box.width/cols, th=box.height/rows, img=getComputedStyle(scr).backgroundImage;
    tl.style.top=(box.top-wb.top)+'px';
    for(var r=0;r<rows;r++)for(var k=0;k<cols;k++){ var s=document.createElement('s'); s.style.cssText='left:'+(k*tw)+'px;top:'+(r*th)+'px;width:'+(tw+1)+'px;height:'+(th+1)+'px;background-image:'+img+';background-size:'+box.width+'px '+box.height+'px;background-position:'+(-k*tw)+'px '+(-r*th)+'px'; tl.appendChild(s); }
    w.classList.add('boom'); flash(.5);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ tl.querySelectorAll('s').forEach(function(s,i){ var dx=(parseFloat(s.style.left)+tw/2-box.width/2), dy=(parseFloat(s.style.top)+th/2-box.height/2); var f=2.2+Math.random()*2.4; s.style.transform='translate('+(dx*f+(Math.random()-.5)*300)+'px,'+(dy*f+(Math.random()-.5)*300+120)+'px) rotate('+((Math.random()-.5)*720)+'deg) scale('+(Math.random()*.6+.2)+')'; s.style.opacity=0; }); }); });
  }
  document.getElementById('go').addEventListener('click', go);
  addEventListener('keydown', function(e){ if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); if(!started) go(); } });
  document.getElementById('skip').addEventListener('click', function(){ location.href=TARGET; });
})();
</script>
